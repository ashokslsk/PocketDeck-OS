name: Deploy Pages

# Publishes the PocketDeck-OS web installer (installer/) to GitHub Pages.
# The X3 app image is taken from dist/pocketdeck-os-x3.bin, so refresh both with
# `pio run -e default && python3 scripts/update_web_installer.py` before pushing.

on:
  push:
    branches: [main]
    paths:
      - "installer/**"
      - "dist/pocketdeck-os-x3.bin"
      - "scripts/update_web_installer.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/configure-pages@v6

      - name: Assemble installer site
        run: python3 scripts/update_web_installer.py --stage _site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

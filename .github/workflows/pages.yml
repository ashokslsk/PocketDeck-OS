name: Deploy Pages

# Publishes the PocketDeck-OS web installer to GitHub Pages
# (Settings > Pages > Source: GitHub Actions). The site keeps the repository
# layout: index.html redirects to installer/, and the installer loads the app
# image from dist/pocketdeck-os-x3.bin. Refresh both with
# `pio run -e default && python3 scripts/update_web_installer.py` before pushing.

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "installer/**"
      - "dist/pocketdeck-os-x3.bin"
      - "scripts/update_web_installer.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build and deploy run as separate jobs so the uploaded site artifact is
  # finalized before deploy-pages looks it up (same layout as GitHub's
  # starter workflow).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/configure-pages@v6

      - name: Assemble installer site
        run: python3 scripts/update_web_installer.py --stage _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

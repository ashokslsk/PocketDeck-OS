name: Deploy Pages

# The web installer is published by GitHub Pages straight from the main branch
# (Settings > Pages > Deploy from a branch, main, / (root)): index.html redirects
# to installer/, and .nojekyll serves the files as they are. No workflow is needed.
#
# This manual workflow is only for repositories whose Pages source is set to
# "GitHub Actions"; it publishes the same layout.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/configure-pages@v6

      - name: Assemble installer site
        run: python3 scripts/update_web_installer.py --stage _site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
